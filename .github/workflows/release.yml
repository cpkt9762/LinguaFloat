name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate version
        id: version
        run: |
          # Get commit count as build number
          BUILD_NUMBER=$(git rev-list --count HEAD)
          # Version format: 1.0.{build_number}
          VERSION="1.0.${BUILD_NUMBER}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Build Release
        run: |
          swift build -c release
          
      - name: Prepare App Bundle
        run: |
          APP_NAME="LinguaFloat"
          APP_BUNDLE="dist/${APP_NAME}.app"
          VERSION="${{ steps.version.outputs.VERSION }}"
          
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          mkdir -p "${APP_BUNDLE}/Contents/Frameworks"
          
          cp .build/release/LinguaFloat "${APP_BUNDLE}/Contents/MacOS/"
          
          cat > "${APP_BUNDLE}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LinguaFloat</string>
              <key>CFBundleIdentifier</key>
              <string>com.pingzi.LinguaFloat</string>
              <key>CFBundleName</key>
              <string>LinguaFloat</string>
              <key>CFBundleDisplayName</key>
              <string>LinguaFloat</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAccessibilityUsageDescription</key>
              <string>LinguaFloat needs accessibility permission to read selected text and simulate paste.</string>
              <key>NSScreenCaptureUsageDescription</key>
              <string>LinguaFloat needs screen capture permission for OCR translation.</string>
          </dict>
          </plist>
          EOF
          
      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG_NAME="LinguaFloat-${VERSION}.dmg"
          
          hdiutil create -volname "LinguaFloat" \
            -srcfolder dist/LinguaFloat.app \
            -ov -format UDZO \
            "${DMG_NAME}"
          
          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: |
            ${{ env.DMG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
